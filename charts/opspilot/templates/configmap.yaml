apiVersion: v1
kind: ConfigMap
metadata:
  name: opspilot-config
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
data:
  TARGET_REPO: {{ required "config.targetRepo is required -- which repo should the agent watch?" .Values.config.targetRepo | quote }}
  LLM_PROVIDER: {{ .Values.config.llmProvider | quote }}
  PORT: "8000"
