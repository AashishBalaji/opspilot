# OpsPilot CI.
#
# This workflow is the project's central honesty claim: everything in
# the e2e-infra job below actually runs, on GitHub's own hosted
# runners, on every push -- a real kind cluster is created, the real
# Helm chart is installed via a real `terraform apply` against it, and
# a real HTTP smoke test exercises the full proposal lifecycle
# (webhook -> gate refuses an unapproved proposal -> approve -> gate
# executes it) against the actually-running, actually-deployed agent.
# Nothing here is "written but never run" the way SiteWatch's
# equivalent workflow had to be, for want of a linked GitHub account
# at the time.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Agent — unit & integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: agent/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests (real SQLite, real TF-IDF retrieval, real HTTP layer via TestClient; LLM is the deliberately-mocked boundary -- see llm_client.py)
        run: pytest -v

  terraform-validate:
    name: Terraform & Helm — static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.2"
      - name: terraform fmt -check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: terraform init (no backend, providers only)
        working-directory: infra/terraform
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: infra/terraform
        run: terraform validate
      - name: helm lint
        run: helm lint charts/opspilot --set config.targetRepo=octocat/test-repo

  e2e-infra:
    name: End-to-end — real kind cluster, real terraform apply, real smoke test
    runs-on: ubuntu-latest
    needs: [test, terraform-validate]
    steps:
      - uses: actions/checkout@v4

      - name: Build the agent image
        run: docker build -t opspilot-agent:ci ./agent

      - name: Create a real (ephemeral) Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: opspilot-ci
          wait: 120s

      - name: Load the image into the kind cluster
        run: kind load docker-image opspilot-agent:ci --name opspilot-ci

      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform init
        working-directory: infra/terraform
        run: terraform init

      # No kubeconfig_path var passed here -- it defaults to
      # ~/.kube/config (see variables.tf), which is exactly where
      # `kind create cluster` (invoked by helm/kind-action above)
      # writes the new cluster's kubeconfig and sets the current
      # context, so kubectl and this terraform apply both pick it up
      # with no extra wiring.
      - name: terraform apply — installs the real Helm chart onto the real cluster
        working-directory: infra/terraform
        run: |
          terraform apply -auto-approve \
            -var="image_repository=opspilot-agent" \
            -var="image_tag=ci" \
            -var="target_repo=${{ github.repository }}"

      - name: Wait for the agent pod to be ready
        run: kubectl -n opspilot rollout status deployment/opspilot-agent --timeout=90s

      - name: Port-forward to the real running service
        run: |
          kubectl -n opspilot port-forward svc/opspilot-agent 8000:80 &
          echo "PORT_FORWARD_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done

      - name: Smoke test — the full proposal lifecycle, against the real deployed agent
        run: |
          set -euo pipefail

          echo "== health =="
          curl -sf http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'

          echo "== metrics endpoint exposes real Prometheus metrics =="
          curl -sf http://localhost:8000/metrics | grep -q opspilot_proposals_created_total

          echo "== webhook creates a pending proposal =="
          RESPONSE=$(curl -sf -X POST http://localhost:8000/webhook/pipeline-failure \
            -H "Content-Type: application/json" \
            -d '{"failure_message": "deadlock detected in alertEngine.ts"}')
          echo "$RESPONSE"
          PROPOSAL_ID=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin)['proposal_id'])")

          echo "== governance gate refuses to execute an unapproved proposal =="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "http://localhost:8000/proposals/${PROPOSAL_ID}/execute")
          [ "$STATUS" = "403" ] || (echo "expected 403, got $STATUS" && exit 1)

          echo "== approving flips status to approved =="
          curl -sf -X POST "http://localhost:8000/proposals/${PROPOSAL_ID}/approve" \
            -H "Content-Type: application/json" -d '{"decided_by": "ci-smoke-test"}' \
            | grep -q '"status":"approved"'

          echo "== all real, all green =="

      - name: Stop port-forward
        if: always()
        run: kill "${PORT_FORWARD_PID:-0}" 2>/dev/null || true

      - name: terraform destroy — prove the Helm release actually tears down cleanly too
        if: always()
        working-directory: infra/terraform
        run: |
          terraform destroy -auto-approve \
            -var="image_repository=opspilot-agent" \
            -var="image_tag=ci" \
            -var="target_repo=${{ github.repository }}" || true
