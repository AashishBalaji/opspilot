[pytest]
# `pytest` (the console script) does not add the current working
# directory to sys.path the way `python -m pytest` does, so without
# this, every `from opspilot...` import in tests/ fails with
# ModuleNotFoundError when CI runs plain `pytest -v` from the `agent`
# directory. This native pytest option (no plugin needed) fixes that
# for both invocation styles, and for any IDE/editor that shells out
# to the bare `pytest` binary too.
pythonpath = .
